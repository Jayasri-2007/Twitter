
<!DOCTYPE html>
<html lang="en">
<head>
<title>Nexora — Social Network</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
:root {
    --bg: #f4eee5;
    --paper: #fffdf9;
    --paper2: #f8f1e7;
    --brown: #5b4636;
    --brown2: #765b43;
    --gold: #c49a62;
    --gold2: #d5b17b;
    --cream: #eadcc8;
    --ink: #241d18;
    --muted: #8b7c70;
    --line: #e6dbcd;
    --danger: #b9574c;
    --green: #71866d;
    --shadow: 0 12px 35px rgba(91, 70, 54, .10);
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN AND SIGNUP */

.auth {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #f4eee5, #eadcc8);
}

.authBox {
    width: 440px;
    max-width: 100%;
    padding: 38px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
}

.brandMark {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--brown), var(--gold));
    color: white;
    font-size: 29px;
    font-weight: 800;
}

.authBox h1 {
    text-align: center;
    color: var(--brown);
    font-size: 28px;
}

.authSub {
    margin: 9px 0 24px;
    text-align: center;
    color: var(--muted);
}

.input {
    width: 100%;
    padding: 14px 15px;
    margin-bottom: 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    background: white;
    color: var(--ink);
}

.input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(196, 154, 98, .13);
}

.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--brown);
    color: white;
    font-weight: 700;
    transition: .2s;
}

.btn:hover {
    background: #473629;
}

.switch {
    margin-top: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

.switch span {
    color: var(--brown);
    font-weight: 700;
    cursor: pointer;
}

.error,
.success {
    min-height: 22px;
    margin-bottom: 7px;
    text-align: center;
    font-size: 13px;
}

.error {
    color: var(--danger);
}

.success {
    color: var(--green);
}

/* MAIN APP LAYOUT */

.app {
    width: min(1440px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 245px minmax(0, 1fr) 300px;
    background: rgba(255, 253, 249, .55);
}

/* LEFT SIDEBAR */

.sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 24px 16px;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    background: rgba(255, 253, 249, .85);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 5px 8px 25px;
    color: var(--brown);
    font-size: 22px;
    font-weight: 800;
}

.brandMarkSmall {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--brown), var(--gold));
    color: white;
}

.brandText span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1.5px;
}

.nav {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 14px;
    margin-bottom: 6px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--brown);
    text-align: left;
    font-size: 15px;
    transition: .2s;
}

.nav:hover,
.nav.active {
    background: #efe3d2;
    color: #4d392a;
    font-weight: 700;
}

.navIcon {
    width: 23px;
    flex-shrink: 0;
    text-align: center;
    font-size: 19px;
}

.postBtn,
.logout {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border-radius: 12px;
    font-weight: 700;
}

.postBtn {
    border: none;
    background: var(--brown);
    color: white;
}

.postBtn:hover {
    background: #473629;
}

.logout {
    border: 1px solid var(--line);
    background: white;
    color: var(--brown);
}

.logout:hover {
    border-color: var(--danger);
    color: var(--danger);
}

/* MAIN CONTENT */

.main {
    min-width: 0;
    min-height: 100vh;
    border-right: 1px solid var(--line);
    background: rgba(255, 253, 249, .65);
}

.header {
    position: sticky;
    top: 0;
    z-index: 5;
    min-height: 72px;
    padding: 15px 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 249, .96);
    color: var(--brown);
    font-size: 18px;
    font-weight: 800;
}

.header small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
}

/* POST COMPOSER */

.composer {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 249, .85);
}

.avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    border-radius: 50%;
    background: linear-gradient(135deg, #b99261, #765b43);
    color: white;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 3px 9px rgba(91, 70, 54, .12);
}

.compose {
    flex: 1;
    min-width: 0;
}

.compose textarea {
    width: 100%;
    min-height: 70px;
    padding: 7px 0;
    border: none;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
}

.compose textarea::placeholder {
    color: #9a8d80;
}

.composerBottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 7px;
}

.imagePicker {
    display: flex;
    align-items: center;
}

.imageLabel {
    padding: 8px 11px;
    border-radius: 9px;
    color: var(--brown2);
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
}

.imageLabel:hover {
    background: #f1e6d8;
}

.sendBtn {
    padding: 10px 20px;
    border: none;
    border-radius: 22px;
    background: var(--brown);
    color: white;
    font-weight: 700;
}

.sendBtn:hover {
    background: #473629;
}

.imagePreview {
    display: none;
    max-width: 100%;
    max-height: 180px;
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    object-fit: cover;
}

/* POSTS */

.post {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 249, .75);
}

.post:hover {
    background: rgba(255, 255, 255, .9);
}

.postContent {
    flex: 1;
    min-width: 0;
}

.postTop {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 8px;
}

.postName {
    color: var(--brown);
    font-weight: 800;
}

.postUsername,
.postTime {
    color: var(--muted);
    font-size: 12px;
}

.postText {
    margin-top: 10px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.postImage {
    display: block;
    width: 100%;
    max-height: 450px;
    margin-top: 13px;
    border: 1px solid var(--line);
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 8px 22px rgba(91, 70, 54, .08);
}

.actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 500px;
    margin-top: 15px;
    color: var(--muted);
}

.action {
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}

.action:hover {
    background: #f1e6d8;
    color: var(--brown);
}

.liked {
    color: #b24f5b;
}

.repost {
    color: #71866d;
}

.followBtn {
    margin-left: auto;
    padding: 7px 13px;
    border: 1px solid var(--brown);
    border-radius: 20px;
    background: white;
    color: var(--brown);
    font-size: 12px;
    font-weight: 700;
}

.followBtn.following {
    background: var(--brown);
    color: white;
}

/* COMMENTS */

.comments {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
}

.comment {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 12px 0;
}

.comment .avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    font-size: 10px;
}

.commentBody {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: #f4ece1;
}

.commentName {
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
}

.commentText {
    margin-top: 5px;
    color: #51463d;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.commentForm {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.commentForm input,
.chatInput {
    flex: 1;
    min-width: 0;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 20px;
    outline: none;
    background: white;
}

.commentForm input:focus,
.chatInput:focus {
    border-color: var(--gold);
}

.commentForm button,
.chatInputBox button {
    padding: 9px 15px;
    border: none;
    border-radius: 20px;
    background: var(--brown);
    color: white;
    font-weight: 700;
}

/* RIGHT SIDEBAR */

.right {
    min-width: 0;
    padding: 22px 17px;
    background: rgba(244, 238, 229, .4);
}

.search {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
    border-radius: 25px;
    background: var(--paper);
}

.search input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
}

.card {
    padding: 17px;
    margin-bottom: 17px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 253, 249, .95);
    box-shadow: 0 7px 20px rgba(91, 70, 54, .05);
}

.card h3 {
    margin-bottom: 10px;
    color: var(--brown);
    font-size: 16px;
}

.person {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
}

.person:last-child {
    border-bottom: none;
}

.personInfo {
    flex: 1;
    min-width: 0;
}

.personName {
    overflow: hidden;
    color: var(--brown);
    font-weight: 800;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.personUsername {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}

.personBtn {
    flex-shrink: 0;
    padding: 8px 11px;
    border: none;
    border-radius: 20px;
    background: var(--brown);
    color: white;
    font-size: 11px;
    font-weight: 700;
}

.personBtn.following {
    border: 1px solid var(--brown);
    background: white;
    color: var(--brown);
}

.smallText {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.empty {
    padding: 65px 20px;
    text-align: center;
    color: var(--muted);
}

.empty h2 {
    margin-bottom: 9px;
    color: var(--brown);
    font-size: 21px;
}

.empty p {
    line-height: 1.6;
}

.pageBox {
    padding: 22px;
}

.pageBox h2 {
    margin-bottom: 16px;
    color: var(--brown);
    font-size: 21px;
}

/* PROFILE */

.profile {
    display: none;
}

.cover {
    position: relative;
    height: 175px;
    overflow: hidden;
    background: linear-gradient(135deg, #c19a65, #e5cda9 45%, #8b6b50);
}

.cover::after {
    position: absolute;
    top: -180px;
    right: -80px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    content: "";
}

.profileInfo {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 249, .8);
}

.profileAvatar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 92px;
    height: 92px;
    margin-top: -62px;
    border: 5px solid var(--paper);
    border-radius: 50%;
    background: linear-gradient(135deg, #b99261, #765b43);
    color: white;
    font-size: 28px;
    font-weight: 800;
}

.profileInfo h2 {
    margin-top: 12px;
    color: var(--brown);
}

.profileBio {
    margin-top: 6px;
    color: #786b5f;
    line-height: 1.5;
}

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    margin-top: 20px;
}

.stats div {
    cursor: pointer;
}

.stats b {
    display: block;
    color: var(--brown);
    font-size: 18px;
}

.stats span {
    color: var(--muted);
    font-size: 13px;
}

.profileActions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 17px;
}

.profileChatBtn {
    padding: 10px 17px;
    border: none;
    border-radius: 20px;
    background: var(--brown);
    color: white;
    font-weight: 700;
}

/* FRIENDS */

.friendCard {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
}

.friendActions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-left: auto;
}

.friendActions button {
    padding: 8px 12px;
    border: none;
    border-radius: 20px;
    background: var(--brown);
    color: white;
    font-size: 12px;
    font-weight: 700;
}

.friendActions .remove {
    border: 1px solid var(--line);
    background: white;
    color: var(--brown);
}

/* MESSAGES */

.chatLayout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    height: calc(100vh - 72px);
    min-height: 400px;
}

.chatUsers {
    overflow-y: auto;
    border-right: 1px solid var(--line);
    background: rgba(248, 241, 231, .6);
}

.chatUser {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
}

.chatUser:hover,
.chatUser.active {
    background: #efe3d2;
}

.chatUserInfo {
    flex: 1;
    min-width: 0;
}

.chatUserInfo b,
.chatUserInfo span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chatUserInfo b {
    color: var(--brown);
    font-size: 13px;
}

.chatUserInfo span {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.chatWindow {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
}

.chatHeader {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 249, .8);
    font-weight: 800;
}

.messages {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 18px;
    overflow-y: auto;
}

.message {
    max-width: 78%;
    align-self: flex-start;
    padding: 10px 13px;
    border-radius: 15px;
    background: #eee3d5;
    overflow-wrap: anywhere;
}

.message.mine {
    align-self: flex-end;
    background: var(--brown);
    color: white;
}

.message small {
    display: block;
    margin-top: 5px;
    font-size: 10px;
    opacity: .7;
}

.chatInputBox {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
    background: rgba(255, 253, 249, .9);
}

.notice {
    padding: 14px;
    margin: 15px;
    border-radius: 12px;
    background: #efe3d2;
    color: #5d4c3e;
}

/* TABLET */

@media (max-width: 1100px) {
    .app {
        grid-template-columns: 78px minmax(0, 1fr);
    }

    .sidebar {
        padding: 17px 9px;
    }

    .brand {
        justify-content: center;
        padding-right: 0;
        padding-left: 0;
    }

    .brandText {
        display: none;
    }

    .nav {
        justify-content: center;
        padding: 13px 8px;
    }

    .navText {
        display: none;
    }

    .postBtn,
    .logout {
        overflow: hidden;
        padding: 12px 0;
        font-size: 0;
    }

    .postBtn::after {
        font-size: 21px;
        content: "+";
    }

    .logout::after {
        font-size: 18px;
        content: "↪";
    }

    .right {
        display: none;
    }
}

/* MOBILE */

@media (max-width: 650px) {
    .app {
        display: block;
        padding-bottom: 66px;
    }

    .sidebar {
        position: fixed;
        z-index: 20;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 3px;
        padding: 5px 4px;
        overflow: visible;
        border-top: 1px solid var(--line);
        border-right: none;
        background: rgba(255, 253, 249, .98);
    }

    .brand,
    .postBtn,
    .logout {
        display: none;
    }

    .nav {
        flex: 1;
        width: auto;
        justify-content: center;
        padding: 12px 2px;
        margin: 0;
        border-radius: 10px;
        font-size: 19px;
    }

    .navIcon {
        width: auto;
    }

    .main {
        min-height: calc(100vh - 64px);
        border: none;
    }

    .header {
        min-height: 65px;
        padding: 13px 17px;
    }

    .composer {
        gap: 10px;
        padding: 15px 13px;
    }

    .composer .avatar,
    .post > .avatar {
        width: 38px;
        height: 38px;
        min-width: 38px;
    }

    .compose textarea {
        min-height: 65px;
        font-size: 14px;
    }

    .post {
        gap: 10px;
        padding: 16px 13px;
    }

    .postTop {
        gap: 5px 7px;
    }

    .postName {
        font-size: 14px;
    }

    .postUsername,
    .postTime {
        font-size: 11px;
    }

    .postText {
        font-size: 14px;
    }

    .postImage {
        max-height: 340px;
        border-radius: 12px;
    }

    .actions {
        gap: 2px;
    }

    .action {
        padding: 6px 4px;
        font-size: 11px;
    }

    .pageBox {
        padding: 17px 13px;
    }

    .profileInfo {
        padding: 16px;
    }

    .profileActions {
        align-items: flex-start;
    }

    .chatLayout {
        grid-template-columns: minmax(0, 1fr);
        height: calc(100vh - 129px);
        min-height: 350px;
    }

    .chatUsers {
        display: none;
    }

    .chatHeader {
        padding: 12px;
    }

    .messages {
        padding: 13px;
    }

    .message {
        max-width: 88%;
    }

    .chatInputBox {
        padding: 10px;
    }

    .friendCard {
        gap: 10px;
    }

    .friendActions {
        width: 100%;
        margin-left: 50px;
    }

    .empty {
        padding: 45px 15px;
    }
}

/* SMALL MOBILE */

@media (max-width: 380px) {
    .authBox {
        padding: 25px 19px;
    }

    .nav {
        padding: 11px 1px;
        font-size: 17px;
    }

    .composerBottom {
        align-items: stretch;
    }

    .sendBtn {
        padding: 9px 14px;
    }

    .stats {
        gap: 17px;
    }

    .followBtn {
        padding: 6px 10px;
    }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="authPage" class="auth">
    <div class="authBox">
        <div class="brandMark">N</div>

        <h1 id="authTitle">Login to Nexora</h1>
        <p class="authSub">Connect. Share. Discover.</p>

        <div id="authMessage" class="error"></div>

        <input id="fullName" class="input hidden"
               placeholder="Full Name">

        <input id="username" class="input"
               placeholder="Username">

        <input id="email" class="input hidden"
               type="email" placeholder="Email">

        <input id="password" class="input"
               type="password" placeholder="Password">

        <button id="authButton" class="btn">Login</button>

        <div id="switchText" class="switch">
            Don't have an account? <span>Sign up</span>
        </div>
    </div>
</div>

<!-- MAIN APPLICATION -->
<div id="appPage" class="hidden">
    <div class="app">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brandMarkSmall">N</div>
                <div class="brandText">
                    NEXORA
                    <span>SOCIAL NETWORK</span>
                </div>
            </div>

            <button class="nav active" data-page="home">
                <span class="navIcon">⌂</span>
                <span class="navText">Home</span>
            </button>

            <button class="nav" data-page="explore">
                <span class="navIcon">⌕</span>
                <span class="navText">Explore</span>
            </button>

            <button class="nav" data-page="friends">
                <span class="navIcon">♧</span>
                <span class="navText">Friends</span>
            </button>

            <button class="nav" data-page="messages">
                <span class="navIcon">✉</span>
                <span class="navText">Messages</span>
            </button>

            <button class="nav" data-page="profile">
                <span class="navIcon">◉</span>
                <span class="navText">Profile</span>
            </button>

            <button class="nav" data-page="following">
                <span class="navIcon">＋</span>
                <span class="navText">Following</span>
            </button>

            <button class="nav" data-page="followers">
                <span class="navIcon">◎</span>
                <span class="navText">Followers</span>
            </button>

            <button class="postBtn" id="postFocusBtn">
                Create Post
            </button>

            <button class="logout" id="logoutBtn">
                Logout
            </button>
        </aside>

        <!-- CENTER CONTENT -->
        <main class="main">

            <div class="header" id="pageTitle">
                Home
                <small>See what your circle is sharing</small>
            </div>

            <!-- CREATE POST -->
            <div class="composer" id="composer">
                <div class="avatar" id="myAvatar"></div>

                <div class="compose">
                    <textarea id="postText"
                              maxlength="500"
                              placeholder="Write a caption for your post..."></textarea>

                    <div class="composerBottom">
                        <div class="imagePicker">
                            <label class="imageLabel" for="postImage">
                                ▣ Add photo
                            </label>

                            <input id="postImage"
                                   type="file"
                                   accept="image/*"
                                   hidden>
                        </div>

                        <button class="sendBtn" id="sendPost">
                            Publish
                        </button>
                    </div>

                    <img id="imagePreview"
                         class="imagePreview"
                         alt="Selected photo preview">
                </div>
            </div>

            <div id="profilePage" class="profile"></div>
            <div id="pageContent"></div>
            <div id="feed"></div>

        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="right">

            <div class="search">
                <span>⌕</span>
                <input id="searchInput" placeholder="Search people">
            </div>

            <div class="card">
                <h3>People to discover</h3>
                <div id="userList"></div>
            </div>

            <div class="card">
                <div class="label">Your account</div>

                <p id="rightUser"
                   style="margin-top:6px;color:var(--brown);font-weight:800">
                </p>

                <p class="smallText" style="margin-top:5px">
                    Your posts, friends and conversations are saved in this browser.
                </p>
            </div>

        </aside>

    </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let users = JSON.parse(localStorage.getItem("nexora_users") || "[]");
let posts = JSON.parse(localStorage.getItem("nexora_posts") || "[]");
let follows = JSON.parse(localStorage.getItem("nexora_follows") || "[]");
let likes = JSON.parse(localStorage.getItem("nexora_likes") || "[]");
let comments = JSON.parse(localStorage.getItem("nexora_comments") || "[]");
let messages = JSON.parse(localStorage.getItem("nexora_messages") || "[]");
let currentUser = JSON.parse(localStorage.getItem("nexora_current") || "null");

let signupMode = false;
let activeChat = null;

function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function saveAll() {
    localStorage.setItem("nexora_users", JSON.stringify(users));
    localStorage.setItem("nexora_posts", JSON.stringify(posts));
    localStorage.setItem("nexora_follows", JSON.stringify(follows));
    localStorage.setItem("nexora_likes", JSON.stringify(likes));
    localStorage.setItem("nexora_comments", JSON.stringify(comments));
    localStorage.setItem("nexora_messages", JSON.stringify(messages));
}

function esc(value) {
    const element = document.createElement("div");
    element.textContent = value ?? "";
    return element.innerHTML;
}

function getUser(id) {
    return users.find(user => String(user.id) === String(id));
}

function initials(name) {
    return name.split(/\s+/)
        .filter(Boolean)
        .map(word => word[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
}

function setMessage(text, type = "error") {
    $("authMessage").textContent = text;
    $("authMessage").className = type;
}

/* AUTHENTICATION */

function switchMode() {
    signupMode = !signupMode;

    $("authTitle").textContent = signupMode
        ? "Create Nexora Account"
        : "Login to Nexora";

    $("fullName").classList.toggle("hidden", !signupMode);
    $("email").classList.toggle("hidden", !signupMode);

    $("authButton").textContent = signupMode
        ? "Create Account"
        : "Login";

    $("switchText").innerHTML = signupMode
        ? 'Already have an account? <span>Login</span>'
        : 'Don\'t have an account? <span>Sign up</span>';

    $("switchText").querySelector("span").onclick = switchMode;

    setMessage("");
}

function signup() {
    const name = $("fullName").value.trim();
    const username = $("username").value.trim().toLowerCase();
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;

    if (!name || !username || !email || !password) {
        return setMessage("Please fill all fields");
    }

    if (username.length < 3) {
        return setMessage("Username must have at least 3 characters");
    }

    if (!/^[a-z0-9_]+$/.test(username)) {
        return setMessage("Username can contain letters, numbers and _ only");
    }

    if (password.length < 6) {
        return setMessage("Password must have at least 6 characters");
    }

    if (users.some(user => user.username === username)) {
        return setMessage("Username already exists");
    }

    const user = {
        id: uid(),
        name,
        username,
        email,
        password,
        avatar: initials(name)
    };

    users.push(user);
    saveAll();

    $("fullName").value = "";
    $("email").value = "";
    $("username").value = "";
    $("password").value = "";

    signupMode = false;

    $("authTitle").textContent = "Login to Nexora";
    $("fullName").classList.add("hidden");
    $("email").classList.add("hidden");
    $("authButton").textContent = "Login";

    $("switchText").innerHTML =
        'Don\'t have an account? <span>Sign up</span>';

    $("switchText").querySelector("span").onclick = switchMode;

    setMessage("Account created. Please login.", "success");
}

function login() {
    const username = $("username").value.trim().toLowerCase();
    const password = $("password").value;

    const user = users.find(
        item => item.username === username && item.password === password
    );

    if (!user) {
        return setMessage("Wrong username or password");
    }

    currentUser = user;

    localStorage.setItem("nexora_current", JSON.stringify(user));

    $("username").value = "";
    $("password").value = "";

    openApp();
}

function openApp() {
    $("authPage").classList.add("hidden");
    $("appPage").classList.remove("hidden");

    $("myAvatar").textContent = currentUser.avatar;

    $("rightUser").textContent =
        currentUser.name + " · @" + currentUser.username;

    showHome();
    showSuggested();
}

function logout() {
    localStorage.removeItem("nexora_current");
    location.reload();
}

/* NAVIGATION */

function setPage(name) {
    document.querySelectorAll(".nav").forEach(button => {
        button.classList.toggle("active", button.dataset.page === name);
    });

    const titles = {
        home: ["Home", "See what your circle is sharing"],
        explore: ["Explore", "Discover new people"],
        friends: ["Friends", "People you connect with"],
        messages: ["Messages", "Private conversations"],
        profile: ["Profile", "Your Nexora profile"],
        following: ["Following", "People you follow"],
        followers: ["Followers", "People following you"]
    };

    const title = titles[name] || [name, ""];

    $("pageTitle").innerHTML =
        esc(title[0]) + "<small>" + esc(title[1]) + "</small>";
}

function clearMain() {
    $("composer").classList.add("hidden");
    $("profilePage").style.display = "none";
    $("feed").innerHTML = "";
    $("pageContent").innerHTML = "";
}

document.querySelectorAll(".nav").forEach(button => {
    button.onclick = () => openPage(button.dataset.page);
});

function openPage(page) {
    if (page === "home") showHome();
    if (page === "explore") showExplore();
    if (page === "friends") showFriends();
    if (page === "messages") showMessages();
    if (page === "profile") showProfile(currentUser.id);
    if (page === "following") showPeople("following");
    if (page === "followers") showPeople("followers");
}

/* FOLLOW AND FRIENDS */

function isFollowing(id) {
    return follows.some(follow =>
        String(follow.follower) === String(currentUser.id) &&
        String(follow.following) === String(id)
    );
}

function areFriends(a, b) {
    return follows.some(f =>
        String(f.follower) === String(a) &&
        String(f.following) === String(b)
    ) && follows.some(f =>
        String(f.follower) === String(b) &&
        String(f.following) === String(a)
    );
}

function friendUsers() {
    return users.filter(user =>
        String(user.id) !== String(currentUser.id) &&
        areFriends(currentUser.id, user.id)
    );
}

function toggleFollow(id) {
    id = String(id);

    if (id === String(currentUser.id)) return;

    const index = follows.findIndex(f =>
        String(f.follower) === String(currentUser.id) &&
        String(f.following) === id
    );

    if (index >= 0) {
        follows.splice(index, 1);
    } else {
        follows.push({
            follower: String(currentUser.id),
            following: id
        });
    }

    saveAll();
    showSuggested();

    const page = $("pageTitle").textContent;

    if (page === "Home") showHome();
    else if (page === "Explore") showExplore();
    else if (page === "Following") showPeople("following");
    else if (page === "Followers") showPeople("followers");
    else if (page === "Friends") showFriends();
    else if (page === "Profile") showProfile(currentUser.id);
}

function followButton(user) {
    if (String(user.id) === String(currentUser.id)) return "";

    const following = isFollowing(user.id);

    return `
        <button class="followBtn ${following ? "following" : ""}"
                data-follow="${esc(user.id)}">
            ${following ? "Following" : "Follow"}
        </button>
    `;
}

function personHTML(user) {
    const following = isFollowing(user.id);

    return `
        <div class="person">
            <div class="avatar">${esc(user.avatar)}</div>

            <div class="personInfo">
                <div class="personName">${esc(user.name)}</div>
                <div class="personUsername">@${esc(user.username)}</div>
            </div>

            <button class="personBtn ${following ? "following" : ""}"
                    data-follow="${esc(user.id)}">
                ${following ? "Following" : "Follow"}
            </button>
        </div>
    `;
}

/* POSTS, PHOTOS AND COMMENTS */

function createPost() {
    const caption = $("postText").value.trim();
    const file = $("postImage").files[0];

    if (!caption && !file) return;

    const addPost = (image = "") => {
        posts.unshift({
            id: uid(),
            userId: String(currentUser.id),
            caption,
            image,
            time: Date.now(),
            likes: 0
        });

        $("postText").value = "";
        $("postImage").value = "";
        $("imagePreview").style.display = "none";
        $("imagePreview").src = "";

        saveAll();
        showHome();
    };

    if (file) {
        const reader = new FileReader();
        reader.onload = () => addPost(reader.result);
        reader.readAsDataURL(file);
    } else {
        addPost();
    }
}

function showHome() {
    setPage("home");

    $("composer").classList.remove("hidden");
    $("profilePage").style.display = "none";
    $("pageContent").innerHTML = "";

    const followingIds = follows
        .filter(f => String(f.follower) === String(currentUser.id))
        .map(f => String(f.following));

    const visible = posts
        .filter(post =>
            String(post.userId) === String(currentUser.id) ||
            followingIds.includes(String(post.userId))
        )
        .sort((a, b) => b.time - a.time);

    $("feed").innerHTML = visible.length
        ? visible.map(postHTML).join("")
        : `
            <div class="empty">
                <h2>Your feed is waiting</h2>
                <p>Follow people and publish your first caption or photo.</p>
            </div>
        `;
}

function postHTML(post) {
    const user = getUser(post.userId);

    if (!user) return "";

    const liked = likes.includes(
        String(currentUser.id) + "_" + String(post.id)
    );

    const postComments = comments
        .filter(comment => String(comment.postId) === String(post.id))
        .sort((a, b) => a.time - b.time);

    const caption = post.caption ?? post.text ?? "";

    return `
        <article class="post">
            <div class="avatar">${esc(user.avatar)}</div>

            <div class="postContent">
                <div class="postTop">
                    <span class="postName">${esc(user.name)}</span>
                    <span class="postUsername">@${esc(user.username)}</span>
                    <span class="postTime">· ${timeAgo(post.time)}</span>
                    ${followButton(user)}
                </div>

                ${caption
                    ? `<div class="postText">${esc(caption)}</div>`
                    : ""}

                ${post.image
                    ? `<img class="postImage"
                            src="${post.image}"
                            alt="Photo posted by ${esc(user.name)}">`
                    : ""}

                <div class="actions">
                    <span class="action" data-comments="${esc(post.id)}">
                        ♡ Comment ${postComments.length}
                    </span>

                    <span class="action">↻ Share</span>

                    <span class="action ${liked ? "liked" : ""}"
                          data-like="${esc(post.id)}">
                        ${liked ? "♥" : "♡"} ${post.likes || 0}
                    </span>

                    <span class="action">↗ Save</span>
                </div>

                <div id="comments-${esc(post.id)}" class="comments hidden">
                    ${postComments.length
                        ? postComments.map(commentHTML).join("")
                        : '<p class="smallText">No comments yet. Be the first to comment.</p>'}

                    <div class="commentForm">
                        <input id="commentInput-${esc(post.id)}"
                               placeholder="Write a comment...">

                        <button data-comment="${esc(post.id)}">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </article>
    `;
}

function likePost(id) {
    const post = posts.find(item => String(item.id) === String(id));

    if (!post) return;

    const key = String(currentUser.id) + "_" + String(id);
    const index = likes.indexOf(key);

    if (index < 0) {
        likes.push(key);
        post.likes = (post.likes || 0) + 1;
    } else {
        likes.splice(index, 1);
        post.likes = Math.max(0, (post.likes || 0) - 1);
    }

    saveAll();

    const page = $("pageTitle").textContent;

    if (page === "Profile") showProfile(currentUser.id);
    else showHome();
}

function commentHTML(comment) {
    const user = getUser(comment.userId);

    if (!user) return "";

    return `
        <div class="comment">
            <div class="avatar">${esc(user.avatar)}</div>

            <div class="commentBody">
                <div class="commentName">
                    ${esc(user.name)}
                    <span style="color:#988a7e;font-weight:500">
                        @${esc(user.username)}
                    </span>
                </div>

                <div class="commentText">${esc(comment.text)}</div>
            </div>
        </div>
    `;
}

function addComment(id) {
    const input = $("commentInput-" + id);

    if (!input) return;

    const text = input.value.trim();

    if (!text) return;

    comments.push({
        id: uid(),
        postId: String(id),
        userId: String(currentUser.id),
        text,
        time: Date.now()
    });

    saveAll();

    const page = $("pageTitle").textContent;

    if (page === "Profile") showProfile(currentUser.id);
    else showHome();

    setTimeout(() => {
        const box = $("comments-" + id);
        if (box) box.classList.remove("hidden");
    }, 25);
}

function toggleComments(id) {
    const box = $("comments-" + id);

    if (box) box.classList.toggle("hidden");
}

/* EXPLORE, FOLLOWERS AND FOLLOWING */

function showPeople(type) {
    clearMain();
    setPage(type);

    let ids;

    if (type === "following") {
        ids = follows
            .filter(f => String(f.follower) === String(currentUser.id))
            .map(f => String(f.following));
    } else {
        ids = follows
            .filter(f => String(f.following) === String(currentUser.id))
            .map(f => String(f.follower));
    }

    const people = users.filter(user => ids.includes(String(user.id)));

    $("feed").innerHTML = people.length
        ? `
            <div class="pageBox">
                <h2>${type === "following" ? "Following" : "Followers"}</h2>
                ${people.map(personHTML).join("")}
            </div>
        `
        : `
            <div class="empty">
                <h2>No ${type} yet</h2>
                <p>${type === "following"
                    ? "Follow people to see them here."
                    : "People who follow you will appear here."}</p>
            </div>
        `;
}

function showExplore() {
    clearMain();
    setPage("explore");

    const people = users.filter(
        user => String(user.id) !== String(currentUser.id)
    );

    $("feed").innerHTML = `
        <div class="pageBox">
            <h2>Discover People</h2>

            ${people.length
                ? people.map(personHTML).join("")
                : '<div class="empty"><h2>No other users</h2></div>'}
        </div>
    `;
}

/* FRIENDS */

function showFriends() {
    clearMain();
    setPage("friends");

    const friends = friendUsers();

    $("feed").innerHTML = friends.length
        ? `
            <div class="pageBox">
                <h2>Your Friends</h2>

                <p class="smallText" style="margin-bottom:10px">
                    Mutual connections can comment on posts and message each other.
                </p>

                ${friends.map(friendCard).join("")}
            </div>
        `
        : `
            <div class="empty">
                <h2>No mutual friends yet</h2>
                <p>Follow someone who also follows you to become friends.</p>
            </div>
        `;
}

function friendCard(user) {
    return `
        <div class="friendCard">
            <div class="avatar">${esc(user.avatar)}</div>

            <div class="personInfo">
                <div class="personName">${esc(user.name)}</div>
                <div class="personUsername">@${esc(user.username)}</div>
            </div>

            <div class="friendActions">
                <button data-chat="${esc(user.id)}">Message</button>
                <button class="remove" data-follow="${esc(user.id)}">
                    Unfollow
                </button>
            </div>
        </div>
    `;
}

/* PROFILE */

function showProfile(id) {
    clearMain();
    setPage("profile");

    const user = getUser(id);

    if (!user) return;

    const postCount = posts.filter(
        post => String(post.userId) === String(id)
    ).length;

    const following = follows.filter(
        follow => String(follow.follower) === String(id)
    ).length;

    const followers = follows.filter(
        follow => String(follow.following) === String(id)
    ).length;

    $("profilePage").style.display = "block";

    $("profilePage").innerHTML = `
        <div class="cover"></div>

        <div class="profileInfo">
            <div class="profileAvatar">${esc(user.avatar)}</div>

            <h2>${esc(user.name)}</h2>

            <p style="color:var(--muted);margin-top:4px">
                @${esc(user.username)}
            </p>

            <p class="profileBio">
                ${String(id) === String(currentUser.id)
                    ? "Welcome to your Nexora profile. Share moments, ideas and photos."
                    : "Nexora member"}
            </p>

            <p class="smallText" style="margin-top:7px">
                ${esc(user.email)}
            </p>

            <div class="stats">
                <div>
                    <b>${postCount}</b>
                    <span>Posts</span>
                </div>

                <div data-profile-following="${esc(user.id)}">
                    <b>${following}</b>
                    <span>Following</span>
                </div>

                <div data-profile-followers="${esc(user.id)}">
                    <b>${followers}</b>
                    <span>Followers</span>
                </div>
            </div>

            ${String(id) !== String(currentUser.id)
                ? `
                    <div class="profileActions">
                        ${followButton(user)}

                        <button class="profileChatBtn"
                                data-chat="${esc(user.id)}">
                            💬 Personal Message
                        </button>
                    </div>
                `
                : ""}
        </div>
    `;

    const ownPosts = posts
        .filter(post => String(post.userId) === String(id))
        .sort((a, b) => b.time - a.time);

    $("pageContent").innerHTML = `
        <div class="pageBox">
            <h2>Posts by ${esc(user.name)}</h2>
        </div>
    `;

    $("feed").innerHTML = ownPosts.length
        ? ownPosts.map(postHTML).join("")
        : `
            <div class="empty">
                <h2>No posts yet</h2>
                <p>${String(id) === String(currentUser.id)
                    ? "Create your first caption or photo above."
                    : "This user has not posted anything yet."}</p>
            </div>
        `;
}

/* MESSAGES */

function showMessages() {
    clearMain();
    setPage("messages");

    const friends = friendUsers();

    $("pageContent").innerHTML = `
        <div class="chatLayout">
            <div class="chatUsers">
                ${friends.length
                    ? friends.map(chatUserHTML).join("")
                    : '<div class="empty"><p>No friends yet.</p></div>'}
            </div>

            <div class="chatWindow" id="chatWindow">
                <div class="empty">
                    <h2>Your Messages</h2>
                    <p>Select a friend to start chatting.</p>
                </div>
            </div>
        </div>
    `;
}

function chatUserHTML(user) {
    return `
        <div class="chatUser ${String(activeChat) === String(user.id) ? "active" : ""}"
             data-chat="${esc(user.id)}">

            <div class="avatar">${esc(user.avatar)}</div>

            <div class="chatUserInfo">
                <b>${esc(user.name)}</b>
                <span>@${esc(user.username)}</span>
            </div>
        </div>
    `;
}

function openChat(id) {
    activeChat = String(id);

    const user = getUser(id);

    if (!user || String(user.id) === String(currentUser.id)) return;

    const chatMessages = messages
        .filter(message =>
            (
                String(message.sender) === String(currentUser.id) &&
                String(message.receiver) === String(id)
            ) ||
            (
                String(message.sender) === String(id) &&
                String(message.receiver) === String(currentUser.id)
            )
        )
        .sort((a, b) => a.time - b.time);

    $("chatWindow").innerHTML = `
        <div class="chatHeader">
            <div style="display:flex;align-items:center;gap:10px">
                <div class="avatar">${esc(user.avatar)}</div>

                <div>
                    ${esc(user.name)}
                    <div class="smallText">@${esc(user.username)}</div>
                </div>
            </div>
        </div>

        <div class="messages" id="messages">
            ${chatMessages.length
                ? chatMessages.map(messageHTML).join("")
                : `
                    <div class="empty" style="padding:40px 15px">
                        <h2>Start a conversation</h2>
                        <p>Send a message to ${esc(user.name)}.</p>
                    </div>
                `}
        </div>

        <div class="chatInputBox">
            <input class="chatInput"
                   id="chatInput"
                   placeholder="Message ${esc(user.name)}...">

            <button id="sendMessage">Send</button>
        </div>
    `;

    const box = $("messages");
    box.scrollTop = box.scrollHeight;

    $("sendMessage").onclick = sendMessage;

    $("chatInput").onkeydown = event => {
        if (event.key === "Enter") sendMessage();
    };
}

function messageHTML(message) {
    const mine =
        String(message.sender) === String(currentUser.id);

    return `
        <div class="message ${mine ? "mine" : ""}">
            ${esc(message.text)}
            <small>${timeAgo(message.time)}</small>
        </div>
    `;
}

function sendMessage() {
    if (!activeChat) return;

    const input = $("chatInput");
    const text = input.value.trim();

    if (!text) return;

    messages.push({
        id: uid(),
        sender: String(currentUser.id),
        receiver: String(activeChat),
        text,
        time: Date.now()
    });

    saveAll();
    openChat(activeChat);
}

/* SEARCH AND SUGGESTIONS */

function searchUsers() {
    const query = $("searchInput").value.trim().toLowerCase();

    if (!query) return showSuggested();

    const people = users.filter(user =>
        String(user.id) !== String(currentUser.id) &&
        (
            user.name.toLowerCase().includes(query) ||
            user.username.toLowerCase().includes(query)
        )
    );

    $("userList").innerHTML = people.length
        ? people.map(personHTML).join("")
        : '<p class="smallText">No matching user.</p>';
}

function showSuggested() {
    const people = users
        .filter(user => String(user.id) !== String(currentUser.id))
        .slice(0, 6);

    $("userList").innerHTML = people.length
        ? people.map(personHTML).join("")
        : '<p class="smallText">No other users yet.</p>';
}

function timeAgo(time) {
    const seconds = Math.floor((Date.now() - time) / 1000);

    if (seconds < 60) return "now";

    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m";

    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + "h";

    const days = Math.floor(hours / 24);
    if (days < 7) return days + "d";

    return new Date(time).toLocaleDateString();
}

/* BUTTON EVENTS */

$("authButton").onclick = () => {
    signupMode ? signup() : login();
};

$("switchText").querySelector("span").onclick = switchMode;

$("postFocusBtn").onclick = () => {
    showHome();

    setTimeout(() => {
        $("postText").focus();
    }, 40);
};

$("logoutBtn").onclick = logout;
$("sendPost").onclick = createPost;
$("searchInput").oninput = searchUsers;

$("postImage").onchange = event => {
    const file = event.target.files[0];
    const preview = $("imagePreview");

    if (!file) {
        preview.style.display = "none";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        preview.src = reader.result;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
};

document.addEventListener("click", event => {
    const follow = event.target.closest("[data-follow]");

    if (follow) {
        toggleFollow(follow.dataset.follow);
        return;
    }

    const like = event.target.closest("[data-like]");

    if (like) {
        likePost(like.dataset.like);
        return;
    }

    const commentToggle = event.target.closest("[data-comments]");

    if (commentToggle) {
        toggleComments(commentToggle.dataset.comments);
        return;
    }

    const commentButton = event.target.closest("[data-comment]");

    if (commentButton) {
        addComment(commentButton.dataset.comment);
        return;
    }

    const chat = event.target.closest("[data-chat]");

    if (chat) {
        if ($("pageTitle").textContent === "Messages") {
            openChat(chat.dataset.chat);
        } else {
            showMessages();

            setTimeout(() => {
                openChat(chat.dataset.chat);
            }, 30);
        }

        return;
    }

    const profileFollowing =
        event.target.closest("[data-profile-following]");

    if (profileFollowing) {
        showPeopleForUser(
            profileFollowing.dataset.profileFollowing,
            "following"
        );
        return;
    }

    const profileFollowers =
        event.target.closest("[data-profile-followers]");

    if (profileFollowers) {
        showPeopleForUser(
            profileFollowers.dataset.profileFollowers,
            "followers"
        );
    }
});

function showPeopleForUser(id, type) {
    clearMain();
    setPage(type);

    const ids = type === "following"
        ? follows
            .filter(follow => String(follow.follower) === String(id))
            .map(follow => String(follow.following))
        : follows
            .filter(follow => String(follow.following) === String(id))
            .map(follow => String(follow.follower));

    const people = users.filter(user => ids.includes(String(user.id)));

    $("feed").innerHTML = people.length
        ? `
            <div class="pageBox">
                <h2>${type === "following" ? "Following" : "Followers"}</h2>
                ${people.map(personHTML).join("")}
            </div>
        `
        : `
            <div class="empty">
                <h2>No ${type}</h2>
            </div>
        `;
}

/* RESTORE LOGIN SESSION */

if (currentUser) {
    const validUser = users.find(
        user => String(user.id) === String(currentUser.id)
    );

    if (validUser) {
        currentUser = validUser;
        openApp();
    }
}
</script>
